name: build
on: [push, pull_request, workflow_dispatch]
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: '8.x' }
      - run: dotnet restore AzdoQualityMetrics.sln
      - run: dotnet build AzdoQualityMetrics.sln -c Release --no-restore
      - run: dotnet test AzdoQualityMetrics.sln -c Release --no-build --collect:"XPlat Code Coverage"
      - run: dotnet publish src/AzdoQualityMetrics/AzdoQualityMetrics.csproj -c Release -r win-x64 --self-contained true -o artifacts/Windows-x64
      - uses: actions/upload-artifact@v4
        with: { name: AzdoQualityMetrics-Windows-x64, path: artifacts/Windows-x64 }
